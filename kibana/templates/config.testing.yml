server.host: "0.0.0.0"
server.port: 5601
server.name: "kibana-test"
server.publicBaseUrl: "${DDEV_PRIMARY_URL}:5601"

# Elasticsearch Configuration
elasticsearch.hosts: ["http://elasticsearch:9200"]

# Monitoring
monitoring.ui.container.elasticsearch.enabled: false
