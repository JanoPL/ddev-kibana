#ddev-generated
# Development Configuration Template for Kibana
# This file is automatically generated and can be safely overwritten

server.host: "0.0.0.0"
server.port: 5601
server.name: "kibana-dev"
server.publicBaseUrl: "${DDEV_PRIMARY_URL}:5601"

# Elasticsearch Configuration
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.requestTimeout: 30000
elasticsearch.shardTimeout: 30000

# Monitoring
monitoring.ui.container.elasticsearch.enabled: true
monitoring.kibana.collection.enabled: true

xpack:
  security:
    enabled: false
# Development features
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.security.encryptionKey: "${KIBANA_SECURITY_KEY}"
xpack.reporting.encryptionKey: "${KIBANA_REPORTING_KEY}"

# Sample data and dev tools
newsfeed.enabled: false
telemetry.enabled: false