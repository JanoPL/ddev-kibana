name: ddev-kibana

project_files:
  - docker-compose.kibana.yaml
  - ./kibana/config.yml
  - ./kibana/Dockerfile
  - ./kibana/healthcheck.sh
  - ./kibana/docker-compose.kibana8.yaml
  - ./kibana/config-manager.sh
  - ./kibana/templates/config.development.yml
  - ./kibana/templates/config.production.yml
  - ./kibana/templates/config.testing.yml
  - ./kibana/validation/validation-schema.yml

dependencies:
  - ddev/ddev-elasticsearch

global_files:

pre_install_actions:
  - |
    #ddev-no-display
    echo "Setting up Kibana configuration management..."
    mkdir -p .ddev/kibana/{templates,backups,validation}

post_install_actions:
  - |
    # Detect environment (default to development)
    ENVIRONMENT=${DDEV_KIBANA_ENV:-development}

    # Check if existing config should be preserved
    if [ -f ./kibana/config.yml ] && ! grep '#ddev-generated' .ddev/kibana/config.yml >/dev/null 2>&1; then
        echo "Existing custom configuration detected!"
        echo "   Your current config.yml will be backed up before generating new configuration."
        echo "   To restore it later, run: ddev exec .ddev/kibana/config-manager.sh restore"
    fi

    # Make config manager executable
    if [ -f ./kibana/config-manager.sh ]; then
      chmod +x ./kibana/config-manager.sh;
    else
      echo "file not existed";
    fi

    if [ -f ./kibana/detect-environment.sh ]; then
      chmod +x ./kibana/detect-environment.sh;
    else
      echo "file not existed";
    fi

    # Generate configuration using the config manager
    cd ./kibana && ./config-manager.sh generate "$ENVIRONMENT"

    # Validate the generated configuration
    if ./config-manager.sh validate; then
        echo "Kibana configuration generated and validated successfully!"
        echo ""
        echo "Configuration Management Commands:"
        echo "  ddev exec .ddev/kibana/config-manager.sh wizard    # Interactive setup"
        echo "  ddev exec .ddev/kibana/config-manager.sh validate  # Validate config"
        echo "  ddev exec .ddev/kibana/config-manager.sh backup    # Backup config"
        echo "  ddev exec .ddev/kibana/config-manager.sh help      # Show all commands"
        echo ""
        echo "Environment: $ENVIRONMENT"
        echo "Access Kibana at: ${DDEV_PRIMARY_URL}:5601"
    else
        echo "Configuration validation failed. Please check the logs."
        exit 1
    fi

yaml_read_files:
