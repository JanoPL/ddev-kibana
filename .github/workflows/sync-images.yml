name: Sync Kibana Images

on:
  pull_request:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' #semantic version format
  schedule:
    - cron: '0 4 * * 1' # every Monday at 04:00 UTC
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

env:
  GHCR_REGISTRY: ghcr.io/janopl/ddev-kibana/kibana-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [7.17.14, 8.10.2, 9.3.3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Kibana image from Docker Hub
        run: |
          docker pull docker.elastic.co/kibana/kibana:${{ matrix.version }}
        continue-on-error: true

      - name: Tag image for GHCR
        run: |
          docker tag docker.elastic.co/kibana/kibana:${{ matrix.version }} \
              ${GHCR_REGISTRY}:${{ matrix.version }}
        continue-on-error: true

      - name: Push image to GHCR
        run: |
          docker push ${GHCR_REGISTRY}:${{ matrix.version }}
        continue-on-error: true
