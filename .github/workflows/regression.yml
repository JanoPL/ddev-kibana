name: regression.yml
on:
  schedule:
    - cron: '00 20 * * 5'
    - cron: '00 07 * * *'
      
permissions:
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: "janopl/ddev-kibana"
  TEST_PATH: .

jobs:
  tests: 
    name: regression test
    defaults: 
      run:
        shell: bash
    
    strategy:
      matrix:
        ddev_version: [ stable ] # ddev_version: [stable, edge, HEAD, PR]
        os: [ ubuntu-24.04 ] # os: ubuntu-20.04, ubuntu-22.04, macos-12, macos-11, ubuntu-latest, macos-latest, windows-2019, windows-2022, windows-latest
      fail-fast: false
      
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: kibana image
        run: |
          docker pull kibana:7.17.14 >/dev/null
          docker pull kibana:8.10.2 >/dev/null
          docker pull kibana:9.3.3 >/dev/null

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Environment setup
        run: |
          brew install jq yq

      - uses: ddev/ddev-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.ADD_ON_LAST_TAG }}
          addon_path: ${{ env.TEST_PATH }}
          disable_checkout_action: false
          test_command: 'bats --timing tests/regression.bats'