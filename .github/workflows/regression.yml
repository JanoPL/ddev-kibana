name: Regression test
on:
  workflow_dispatch:
  schedule:
    - cron: '15 04 * * *'
      
permissions:
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: "janopl/ddev-kibana"
  TEST_PATH: .

jobs:
  tests: 
    name: Regression Test
    defaults: 
      run:
        shell: bash
    
    strategy:
      matrix:
        ddev_version: [ stable ] # ddev_version: [stable, edge, HEAD, PR]
        os: [ ubuntu-24.04 ]
      fail-fast: false
      
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: kibana image
        run: |
          docker pull ghcr.io/janopl/ddev-kibana/kibana-sync:9.3.3 >/dev/null

      - uses: ddev/ddev-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.ADD_ON_LAST_TAG }}
          addon_path: ${{ env.TEST_PATH }}
          disable_checkout_action: false
          test_command: 'bats --timing tests/regression.bats'